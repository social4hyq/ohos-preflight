bun = false
solution = "HarmonyOS 默认不授予此 capability，需系统级权限签名"
no_portable_fallback = "capability 由内核 LSM/签名授予，应用层无法在运行期获取；唯一路径是申请系统级签名（与 a3_ptrace 的 fallback 重叠：调试时用 SIGSEGV crash handler 替代）。"

[[probes]]
