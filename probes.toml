priority = "P2"
fallback_probe = "j1_ptrace_fb"
impact = "ptrace 是调试器（gdb、lldb）和性能分析工具（perf）的基础。HarmonyOS 应用沙箱拒绝 PTRACE_TRACEME，开发者无法在真机上调试 Bun/Node.js 进程。"
trigger_path = """
调试器 attach (gdb / lldb / JSC inspector)
  → ptrace(PTRACE_TRACEME, 0, NULL, NULL)
    → 返回 EPERM（沙箱禁止 ptrace）"""
solution_file = "solutions/a3_ptrace.c"

[[probes]]
