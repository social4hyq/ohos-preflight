bun = false
solution = "内核未实现 Landlock LSM，暂无替代方案"
no_portable_fallback = "Landlock 是内核 LSM 模块，应用层无法用户态模拟（任何 chroot/namespace 替代都需要 CAP_SYS_ADMIN，HarmonyOS 沙箱已拒绝）。等价能力需要等内核启用 Landlock。"

[[probes]]
id = "a6_bpf"
category = "A"
desc = "bpf(BPF_MAP_CREATE) BPF map 创建 — 通用 eBPF 能力探针"
bun = false
vite_plus = false
priority = "P2"
solution = "BPF 被沙箱限制，需系统级权限或特权进程"
no_portable_fallback = "bpf() syscall 在沙箱中直接返回 EPERM；无可用的用户态等价物。注意：seccomp 使用 cBPF（经典BPF），由 seccomp() 内核内部处理，用户态不直接调用 bpf()。eBPF map 用于 tracing/网络等场景，非前端工具链依赖。"
trigger_path = """
通用 Linux eBPF 能力（非特定项目依赖）:
  → bpf(BPF_MAP_CREATE, ...) — 创建 eBPF map
  → 用于: bpftrace, eBPF 网络监控, 性能分析工具
  → 注意: seccomp 使用 cBPF，由 seccomp() syscall 内核内部加载，不经过 bpf()"""

[[probes]]
id = "a7_userfaultfd"
category = "A"
desc = "userfaultfd 用户态缺页处理"
bun = false
solution = "内核未实现 userfaultfd，暂无替代方案"
no_portable_fallback = "userfaultfd 需内核支持，无用户态等价方案；JIT/checkpoint 等场景需改用 mprotect + SIGSEGV handler 自实现 page fault 拦截（开销远高于 uffd，不构成等价替代）。"

[[probes]]
id = "a8_rseq"
category = "A"
desc = "rseq (293) 可重启序列 — glibc 启动时注册（musl 不注册）"
bun = false
bun_run = true
solution = "向 HarmonyOS 团队申请放行 rseq (293)；仅影响 glibc 工具链，不影响 musl/Bun"
priority = "P2"
impact = "rseq 是 Linux 5.1+ 内核特性，用于 per-CPU 无锁操作加速。仅 glibc (≥2.35) 在线程创建时自动注册 rseq；musl 不注册 rseq，Bun 不受影响。影响范围：glibc 链接的 Node.js/Deno 等运行时在 HarmonyOS 上可能触发 SIGSYS。"
trigger_path = """
glibc 进程/线程启动
  → __init_tp / start_thread 自动注册 rseq
    → syscall(SYS_rseq=293, &rseq, sizeof rseq, 0, RSEQ_SIG)
      → seccomp filter → SIGSYS → 进程终止

注：Bun 使用 musl libc，musl 未实现 rseq 注册，因此 Bun 不受此影响。"""
solution_file = "solutions/a8_rseq.c"

