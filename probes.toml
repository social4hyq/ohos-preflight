# ohos-preflight 探针元数据 — 新增探针只需在此添加一条 [[probes]]
# 维护此文件而非 Python 代码中的硬编码字典

[status_labels]
pass = "通过"
fail = "失败"
unsupported = "不适用"

[reason_hints]
"Permission denied" = "权限不足"
"Operation not permitted" = "操作被禁止"
"Function not implemented" = "内核未实现该调用"
"Invalid argument" = "参数无效（内核不支持）"
"No such file or directory" = "路径不存在或无法访问"
"not writable" = "目录不可写"
"not executable" = "路径不可执行"
"not set" = "未配置"
"not found" = "未找到"
"no writable directory found" = "无可写目录"
"Symbol not found" = "libc 中不存在该符号"
"core dumped" = "进程崩溃 (SIGSYS)"
"is a no-op stub" = "函数为空实现桩"
"did not load" = "动态库未加载"
"not in libc" = "libc 中不存在"
"not in PATH" = "工具链未安装"
"produced" = "行为与预期不符"
"SIGSYS" = "被 seccomp 沙箱拦截（SIGSYS）"
"not implemented" = "内核未实现该接口"

[category.A]
name = "内核能力"
detail = "seccomp / ptrace / rseq / pidfd_open / close_range / bpf / landlock / userfaultfd / perf_event"

[category.B]
name = "动态链接器"
detail = "LD_PRELOAD / dlsym(RTLD_NEXT/RTLD_DEFAULT) / dlopen / naked_asm"

[category.C]
name = "系统调用 (raw syscall)"
detail = "raw syscall: statx / renameat2 / openat2 / clone3 / getrandom / futex / epoll / preadv2 / getdents64 等 15 项"

[category.D]
name = "文件与内存"
detail = "POSIX shm / memfd / mmap(MAP_SHARED) / copy_file_range"

[category.E]
name = "IPC / 事件通知"
detail = "socketpair / SCM_RIGHTS / eventfd / signalfd / epoll / fanotify"

[category.F]
name = "进程信息"
detail = "/proc/self / prctl(PR_GET_NAME)"

[category.G]
name = "文件系统与符号"
detail = "tmpfile / dladdr / emulated TLS"

[category.H]
name = "扩展 libc 函数"
detail = "pthread_cancel / program_invocation_name / _res / getusershell / getpass"

[category.I]
name = "集成与环境"
detail = "HMDFS / sendfile / posix_spawn / pty / /dev/fd / /data/local/tmp / linux 宏"

[category.J]
name = "替代方案验证"
detail = "needs_relax 探针的 fallback solution_code 双轨验证（J = needs_relax 项的替代实现是否真的可用）"

[category.K]
name = "降级点回归"
detail = "ohos-bun (ohos-aarch64 分支) / ohos-compat-shim 里已知的能力型降级点逐条回归检查；每条对应一处具体的 #[cfg(target_env = \"ohos\")] 代码或等价降级，pass 意味着对应降级可能已经可以撤销"

[[probes]]
id = "a1_seccomp_unotify"
category = "A"
desc = "seccomp 用户态通知 (SECCOMP_IOCTL_NOTIF_RECV)"
bun = false
vite_plus = true
solution = "向 HarmonyOS 团队申请放行 seccomp 能力；libc 层调用审计可用 LD_PRELOAD shim 替代（拦截 libc 函数 + RTLD_NEXT 转发，无法拦截 raw syscall）"
priority = "P1"
fallback_probe = "j13_seccomp_shim_fb"
impact = "seccomp 用户态通知机制用于实现用户空间 syscall 拦截（调试器、沙箱、profiler）。HarmonyOS 拒绝 SECCOMP_SET_MODE_FILTER，调试工具链（如 strace 替代品、Node inspector）无法工作。"
trigger_path = """
调试工具 (strace / seccomp sandbox)
  → seccomp(SECCOMP_SET_MODE_FILTER, SECCOMP_FILTER_FLAG_NEW_LISTENER)
    → 返回 EINVAL（参数无效 / 沙箱禁止）

vite-plus fspy 系统调用拦截:
  → vite-task/crates/fspy_seccomp_unotify — seccomp 用户态通知
  → seccomp(SECCOMP_SET_MODE_FILTER, SECCOMP_FILTER_FLAG_NEW_LISTENER)
  → seccompiler (rust-vmm/seccompiler) — BPF filter 编译"""
solution_file = "solutions/a1_seccomp_unotify.c"

